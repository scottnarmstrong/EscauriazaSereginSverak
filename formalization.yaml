    relationship: "formalizes"
    note: >-
      The included manuscript is the mathematical source for every main
      theorem of this library (the Leray existence and associated-pressure
      parts, formerly Parts II and III, are now in the CKN paper); Part VI of it is the source of the Ladyzhenskaya-Prodi-Serrin
      theorem and its corollary. The Lean development follows its proof route, with
      representation choices and departures from the cited sources described
      in docs/DEVIATIONS.md and docs/DESIGN_NOTES.md.
    license: "Apache-2.0"
