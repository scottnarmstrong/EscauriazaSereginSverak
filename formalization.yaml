related_formalizations:
  - id: "https://github.com/scottnarmstrong/CaffarelliKohnNirenberg"
    relationship: "builds-on"
    note: >-
      The Caffarelli-Kohn-Nirenberg formalization (Armstrong, Vicol) is a Lake
      dependency pinned to the exact commit 381d658ead0f03a18361965cc0427ce3fa5844ab (both libraries use
      Lean's module system). Its suitable-weak-solution class, regular and
      singular points, and Theorems A and C are used unchanged. Since
      2026-09-29 it also contains the Leray background moved out of this
      repository: the definitions CKN.IsInJ, CKN.IsLerayHopfSolution,
      CKN.IsGlobalLerayHopfSolution, CKN.IsForcedLerayHopfSolution,
      CKN.IsGlobalForcedLerayHopfSolution, CKN.IsLocallySquareIntegrableForce,
      CKN.IsLocallyQIntegrableForce, CKN.forcedQuadraticTensor and
      CKN.HasSpaceTimeWeakDerivs, and the theorems CKN.leray_existence,
      CKN.leray_existence_singularSet, CKN.associatedPressure,
      CKN.lerayExistenceForced, CKN.lerayExistenceForcedSingularSet and
      CKN.associatedPressureForced. These six theorems are results of that
      dependency and are not main results of this repository. CKN's Leray
      comparator pair restates five of them; CKN.associatedPressureForced has
      no comparator restatement.

status:
  scope: >-
    Complete for the ten main theorems of this library as stated in the
    manuscript (thm:ess-local,
    thm:ess-global, thm:ess-l5-unique, thm:uc, thm:bu, prop:carleman-gauss,
    prop:carleman-halfspace, thm:lps, cor:ess-smooth and cor:serrin-criterion);
    the Leray existence theorems (thm:leray, cor:ckn-headline,
    thm:assoc-pressure, thm:leray-forced, thm:leray-forced-singularSet,
    thm:assoc-pressure-forced) are proved in the CKN dependency. Space is R^3;
    the Leray-Hopf and suitable solution notions (both from CKN) use one
    every-time velocity representative with an explicit weak gradient. The
    regularity theorems are unforced, as in the source. Theorem 1.3 of Escauriaza-Seregin-Sverak is
    proved in full, including smoothness on R^3 x (0,T] (one-sided at T),
    through the Ladyzhenskaya-Prodi-Serrin theorem, which is proved for the
    whole range 3 < s <= infinity. The linear theorems are stated in three
    dimensions for fields with explicit space-time weak derivatives. The
    supporting library (1,008 files, about 205,000 lines) contains the
    local energy equality, the blow-up argument, the vorticity bootstrap, the
    Carleman estimates, the L^5 and weak-strong uniqueness development, and the
    Part VI development for the Ladyzhenskaya-Prodi-Serrin theorem (Serrin
    mixed norms, the energy equality under the Serrin condition, the local
    strong solution, continuation and smoothing). The
    representation choices and departures from the sources are described in
    docs/DESIGN_NOTES.md and docs/DEVIATIONS.md.
