# Metadata schema version.
version: "v0.4"

project:
  name: "Escauriaza–Seregin–Šverák and Ladyzhenskaya–Prodi–Serrin regularity"
  description: >-
    A Lean 4 / Mathlib formalization (in Lean's module system), built on the
    published Caffarelli-Kohn-Nirenberg formalization, of the
    Escauriaza-Seregin-Sverak theorem: Leray-Hopf solutions of the
    three-dimensional incompressible Navier-Stokes equations on R^3 bounded in
    L^infinity(0,T;L^3) have no singular points, lie in L^5, are unique and
    are smooth on R^3 x (0,T] (Theorem 1.3 of that paper in full), and of the
    Ladyzhenskaya-Prodi-Serrin theorem: Leray-Hopf solutions in
    L^l(0,T;L^s) with 3/s + 2/l = 1 and 3 < s <= infinity are unique and
    smooth on R^3 x (0,T]. Leray's global existence theorem in suitable form
    (with and without forcing), the associated pressure and the Leray-Hopf
    definitions are in the CKN formalization (moved there on 2026-09-29) and
    are used here. The local L^3 regularity theorem and the Carleman,
    unique-continuation and backward-uniqueness theorems it rests on are
    proved in full. Every main theorem is proved using only the standard
    axioms. The manuscript being formalized is in the repository and was
    corrected alongside the development; its Parts II and III now live in the
    CKN paper.
  authors:
    - "Scott Armstrong"
  responsible_maintainers:
    - "Scott Armstrong"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."

classification:
  arxiv: ["math.AP"]
  msc2020: ["35Q30", "76D05", "35B65", "35D30", "35B60"]

