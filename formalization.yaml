automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "gpt-6-luna"
        - "gpt-6-sol"
        - "claude-sonnet-5-5"
      framework: >-
        Claude Opus 5.5 coordinated the work under the author's supervision. Most
        of the library was written with GPT-6 Luna (reasoning effort xhigh, up to
        eight concurrent Codex instances) and GPT-6 Sol (reasoning effort high,
        at most one instance). The Ladyzhenskaya-Prodi-Serrin part, the
        Mathlib-only comparators, the transfer of the Leray background to CKN and
        the port to Lean's module system were done with Claude Sonnet 5.5 (at most
        four concurrent instances).
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2, with the published CKN formalization as
        a pinned Lake dependency. The main theorem statements were reviewed and
        fixed before their proofs were developed. Verification uses source
        checks, a build of every library module, comparator statements and
        solutions, independent NanoDa replay, and axiom checks. The commands
        are documented in docs/VERIFICATION.md and run by the repository's CI
        workflows.
      cost:
        wall_time: "development between 2026-09-26 and 2026-09-29, including cleanup and release preparation"
        compute: "about 8 concurrent model instances, i.e. on the order of 400 model-instance hours (estimate)"
        spend_usd: "not separately metered (ChatGPT Pro and Claude Max subscriptions)"
        hardware: "one 16-CPU / 124 GB RAM Linux machine"
      prompting_notes: >-
        The author determined the mathematical statements and reviewed changes
        to the manuscript. Separate reviews compared the formal statements with
        the manuscript and checked the use of intermediate results in the proofs.

  spend_usd: "not separately metered (ChatGPT Pro and Claude Max subscriptions)"
  notes: >-
    All Lean code was written by the listed models under the supervision of the
    author, who decided the mathematics, the statements and the corrections to
    the manuscript. Every proof is checked by the Lean kernel; the library
    contains no sorry and no custom axiom. The two comparator Challenges
    (comparators/{Linear,Regularity}/Challenge.lean) import only
    Mathlib, define every notion from Mathlib, and contain exactly ten
    intentional theorem-body placeholders (4 + 6), one for each of the
    ten main theorems. The separate Solution.lean files
    prove the same named declarations from the library with transport lemmas;
    each pair's comparator.json selects its declarations (ten in all). The
    comparator pair for the Leray theorems is in the CKN repository.

fidelity:
  divergences: >-
    Recorded in docs/DEVIATIONS.md and docs/DESIGN_NOTES.md. The main ones:
    a Leray-Hopf solution (CKN.IsLerayHopfSolution) is one specified function
    whose every time slice is constrained (weak continuity on the closed
    interval, the energy inequality at every time, the strong initial trace),
    and the same function is the suitable weak solution; a global solution is a Leray-Hopf solution on every
    finite interval [0, T]; the local regularity theorem is stated on the
    coherent cylinder B_1 x (-1, 0), correcting a sign mismatch in the printed
    statement of ESS Theorem 1.4; the associated pressure (in CKN) is the
    whole-space double Riesz transform with a fixed sign; the linear theorems are stated in
    three dimensions for W^{2,1}_2 fields with explicit weak-derivative data and
    continuity where a trace is evaluated; the endpoint argument replaces the all-orders Stokes estimates by a finite
    vorticity bootstrap and closes the singular-point lower bound through an
    open-top smallness criterion; the L^5 and uniqueness theorem uses a
    manuscript proof of the short-time L^5 bound and a (5,5) weak-strong
    comparison instead of the external mixed-norm estimate cited in ESS. The
    Ladyzhenskaya-Prodi-Serrin theorem (Part VI of the manuscript) follows
    Robinson-Rodrigo-Sadowski, Theorems 8.17 and 8.19, with these
    differences: no strong energy inequality is assumed, and the energy
    equality is proved almost everywhere in time from the Serrin condition;
    the local strong solution comes from the Fourier L^2
    machinery of the CKN library, comparison at restart times is by concatenation, and
    smoothing is a direct regularity ladder on the strong solution; the
    endpoint s = infinity and smoothness up to the final time T are proved
    explicitly. Equality of solutions is almost everywhere.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
  notes: >-
    Lean checks each proof against its formal statement. The author reviewed
    that the statements are the intended theorems; the statements were
    compared with the manuscript by independent read-only reviews, including two independent pre-publication reviews with GPT-6 Sol, and
    the comparator declarations are checked mechanically. This is not
    external peer review.

alignment:
  namespace: "ESS"
  statements:
    - source: "Theorem thm:ess-local, local regularity (ESS Theorem 1.4)"
      lean: "ESS.essLocal"
      module: "ESS.Statements.EssLocal"
      status: "proved"
      note: "Comparator pair comparators/Regularity/{Challenge,Solution}.lean."
    - source: "Theorem thm:ess-global, regularity of L^infinity L^3 Leray-Hopf solutions (ESS Theorem 1.3)"
      lean: "ESS.essGlobal"
      module: "ESS.Statements.EssGlobal"
      status: "proved"
      note: "Comparator pair comparators/Regularity/{Challenge,Solution}.lean. Conclusion: the CKN singular set on R^3 x (0, T) is empty."
    - source: "Theorem thm:ess-l5-unique, L^5 bound and uniqueness (ESS Theorem 1.3)"
      lean: "ESS.essL5Unique"
      module: "ESS.Statements.EssL5Unique"
      status: "proved"
      note: "Comparator pair comparators/Regularity/{Challenge,Solution}.lean."
    - source: "Theorem thm:uc, unique continuation across a spatial boundary (ESS Theorem 4.1)"
      lean: "ESS.uniqueContinuation"
      module: "ESS.Statements.UniqueContinuation"
      status: "proved"
      note: "Comparator pair comparators/Linear/{Challenge,Solution}.lean."
    - source: "Theorem thm:bu, backward uniqueness on a half-space (ESS Theorem 5.1)"
      lean: "ESS.backwardUniqueness"
      module: "ESS.Statements.BackwardUniqueness"
      status: "proved"
      note: "Comparator pair comparators/Linear/{Challenge,Solution}.lean, for every real growth rate M as in the manuscript; the library statement assumes 0 < M, which loses nothing (the Solution applies it with max M 1)."
    - source: "Proposition prop:carleman-gauss, Carleman inequality with a Gaussian weight (ESS Proposition 6.1)"
      lean: "ESS.carlemanGaussian"
      module: "ESS.Statements.CarlemanGaussian"
      status: "proved"
      note: "Comparator pair comparators/Linear/{Challenge,Solution}.lean. The constant is stated existentially, as in ESS; the proof supplies the explicit value of the manuscript."
    - source: "Proposition prop:carleman-halfspace, Carleman inequality on a half-space (ESS Proposition 6.2)"
      lean: "ESS.carlemanHalfSpace"
      module: "ESS.Statements.CarlemanHalfSpace"
      status: "proved"
      note: "Comparator pair comparators/Linear/{Challenge,Solution}.lean. The constants are stated existentially, as in ESS; the proof supplies the explicit values of the manuscript."
    - source: "Theorem thm:lps, Ladyzhenskaya-Prodi-Serrin uniqueness and smoothness (ESS Theorem 1.2; Robinson-Rodrigo-Sadowski Theorems 8.17 and 8.19)"
      lean: "ESS.ladyzhenskayaProdiSerrin"
      module: "ESS.Statements.LadyzhenskayaProdiSerrin"
      status: "proved"
      note: "Comparator pair comparators/Regularity/{Challenge,Solution}.lean. Serrin condition for 3 < s < infinity with l = 2s/(s-3), or L^2 L^infinity; conclusion: uniqueness among Leray-Hopf solutions with the datum (almost everywhere) and an almost-everywhere equal representative that is C^infinity on R^3 x (0, T], one-sided at T."
    - source: "Corollary cor:ess-smooth, smoothness of L^infinity L^3 Leray-Hopf solutions (ESS Theorem 1.3 in full)"
      lean: "ESS.essSmooth"
      module: "ESS.Statements.EssSmooth"
      status: "proved"
      note: "Comparator pair comparators/Regularity/{Challenge,Solution}.lean. L^5, uniqueness and a C^infinity representative on R^3 x (0, T], from thm:ess-l5-unique and thm:lps."
    - source: "Corollary cor:serrin-criterion, the regularity criterion for 3 <= s <= infinity"
      lean: "ESS.serrinCriterion"
      module: "ESS.Statements.SerrinCriterion"
      status: "proved"
      note: "Comparator pair comparators/Regularity/{Challenge,Solution}.lean. Leray-Hopf solution on [0, T] in L^infinity L^3, or in L^l L^s with 3 < s < infinity and l = 2s/(s-3), or in L^2 L^infinity: unique among Leray-Hopf solutions with the datum (almost everywhere) and almost everywhere equal to a function that is C^infinity on R^3 x (0, T], one-sided at T."
    - source: "Leray existence, associated pressure, Leray-Hopf definitions (thm:leray, cor:ckn-headline, thm:assoc-pressure, thm:leray-forced, thm:leray-forced-singularSet, thm:assoc-pressure-forced, def:leray-hopf, rem:global-LH, def:forced-leray-hopf, space-time weak derivatives)"
      lean: "CKN.leray_existence"
      module: "CKN.Statements.LerayExistence"
      status: "proved"
      note: "Provided by the CKN dependency, not restated here; the other declarations are CKN.leray_existence_singularSet, CKN.associatedPressure, CKN.lerayExistenceForced, CKN.lerayExistenceForcedSingularSet, CKN.associatedPressureForced and the definitions CKN.IsInJ, CKN.IsLerayHopfSolution, CKN.IsGlobalLerayHopfSolution, CKN.IsForcedLerayHopfSolution, CKN.IsGlobalForcedLerayHopfSolution, CKN.HasSpaceTimeWeakDerivs."
    - source: "Part VI, the class of local strong solutions used in the Ladyzhenskaya-Prodi-Serrin proof"
      lean: "ESS.isLpsStrongSolution_zero"
      module: "ESS.LPS.StrongSolutionZero"
      status: "proved"
      note: "Witness that ESS.IsLpsStrongSolution is inhabited; see docs/WITNESSES.md."

